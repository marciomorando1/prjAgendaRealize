{% extends 'base.html' %}

{% block title %}Status de Projetos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-tasks"></i> Status de Projetos</h2>
    <a href="{% url 'statusprojeto_create' %}" class="btn btn-primary">
        <i class="fas fa-plus"></i> Novo Status
    </a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Cor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for status in object_list %}
                    <tr>
                        <td>{{ status.descricao }}</td>
                        <td>
                            <span class="badge" style="background-color: {{ status.cor }}; color: white; padding: 5px 10px;">
                                {{ status.cor }}
                            </span>
                        </td>
                        <td>
                            <a href="{% url 'statusprojeto_update' status.pk %}" class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{% url 'statusprojeto_delete' status.pk %}" class="btn btn-sm btn-danger">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">Nenhum status cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
