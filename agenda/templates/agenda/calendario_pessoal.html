{% extends 'base.html' %}
{% load static %}

{% block title %}Meu Calendário{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-calendar me-2"></i>Meu Calendário</h2>
    <span class="badge bg-info fs-6">Arquiteto</span>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">
            <i class="fas fa-calendar-alt me-2"></i>Obras Agendadas
        </h5>
    </div>
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>

<!-- Modal para edição -->
<div class="modal fade" id="editarProjetoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Projeto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Conteúdo carregado via AJAX -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js'></script>

<style>
    #calendar {
        max-width: 100%;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        padding: 20px;
    }
    .fc-event {
        cursor: pointer;
        border: none;
        padding: 2px 5px;
        font-size: 0.85em;
    }
    .fc-toolbar {
        flex-wrap: wrap;
    }
    @media (max-width: 768px) {
        #calendar {
            padding: 10px;
        }
        .fc-toolbar-title {
            font-size: 1.2em;
        }
    }
</style>

// NO calendario_pessoal.html - substituir todo o bloco JavaScript por este:
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: {
            today: 'Hoje',
            month: 'Mês',
            week: 'Semana',
            day: 'Dia',
            list: 'Lista'
        },
        events: '/api/projetos/',
        editable: true,
        eventDrop: function(info) {
            // Atualizar data quando evento é arrastado
            atualizarDataProjeto(info.event.id, info.event.start);
        },

        eventClick: function(info) {
            // Abrir página de edição em nova aba
            window.open(`/projeto/${info.event.id}/editar/`, '_blank');
        },

        eventDidMount: function(info) {
            const cor = info.event.extendedProps.status_cor;
            if (cor) {
                info.el.style.backgroundColor = cor;
                info.el.style.borderColor = cor;
                
                const brightness = getBrightness(cor);
                info.el.style.color = brightness > 128 ? 'black' : 'white';
            }
        },
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            meridiem: false
        }
    });
    
    calendar.render();
});

function atualizarDataProjeto(projetoId, novaData) {
    const formData = new FormData();
    formData.append('data_agendada', novaData.toISOString().slice(0, 16));
    formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));

    fetch(`/projeto/${projetoId}/editar-arquiteto/`, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (!data.success) {
            alert('Erro ao atualizar data: ' + (data.errors || 'Erro desconhecido'));
            location.reload(); // Recarregar para voltar ao estado anterior
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao atualizar data do projeto');
        location.reload();
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function getBrightness(hex) {
    hex = hex.replace(/^#/, '');
    
    if (hex.length === 3) {
        hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    }
    
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    
    return (r * 299 + g * 587 + b * 114) / 1000;
}
</script>

{% endblock %}
