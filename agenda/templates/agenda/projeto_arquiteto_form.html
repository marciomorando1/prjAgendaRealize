<!-- agenda/templates/agenda/projeto_arquiteto_form.html -->
<form method="post" action="{% url 'projeto_arquiteto_update' projeto.id %}" id="projetoArquitetoForm">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="{{ form.status.id_for_label }}" class="form-label">Status</label>
        <select name="{{ form.status.name }}" id="{{ form.status.id_for_label }}" 
                class="form-select {% if form.status.errors %}is-invalid{% endif %}" required>
            <option value="">Selecione o status</option>
            {% for status in form.status.field.queryset %}
                <option value="{{ status.pk }}" 
                    {% if form.status.value == status.pk %}selected{% endif %}>
                    {{ status.descricao }}
                </option>
            {% endfor %}
        </select>
        {% if form.status.errors %}
            <div class="invalid-feedback">
                {{ form.status.errors.0 }}
            </div>
        {% endif %}
    </div>
    
    <div class="mb-3">
        <label for="{{ form.data_agendada.id_for_label }}" class="form-label">Data Agendada</label>
        <input type="datetime-local" name="{{ form.data_agendada.name }}" 
               id="{{ form.data_agendada.id_for_label }}" 
               class="form-control {% if form.data_agendada.errors %}is-invalid{% endif %}" 
               value="{{ form.data_agendada.value|date:'Y-m-d\TH:i' }}" required>
        {% if form.data_agendada.errors %}
            <div class="invalid-feedback">
                {{ form.data_agendada.errors.0 }}
            </div>
        {% endif %}
    </div>
    
    <div class="mb-3">
        <label for="{{ form.observacao.id_for_label }}" class="form-label">Observação</label>
        <textarea name="{{ form.observacao.name }}" id="{{ form.observacao.id_for_label }}" 
                  class="form-control {% if form.observacao.errors %}is-invalid{% endif %}" 
                  rows="4">{{ form.observacao.value|default:'' }}</textarea>
        {% if form.observacao.errors %}
            <div class="invalid-feedback">
                {{ form.observacao.errors.0 }}
            </div>
        {% endif %}
    </div>
    
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    </div>
</form>

<script>
document.getElementById('projetoArquitetoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Fechar modal e recarregar a página
            const modal = bootstrap.Modal.getInstance(document.getElementById('editarProjetoModal'));
            modal.hide();
            location.reload();
        } else {
            alert('Erro ao salvar: ' + (data.errors || 'Erro desconhecido'));
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao salvar alterações');
    });
});
</script>
